name: QA status snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: qa-status-snapshot
  cancel-in-progress: true

jobs:
  patch-and-validate:
    if: github.head_ref == 'agent/qa-status-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-local-move-snapshot-pieces
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply confirmed snapshot boundary fix
        run: |
          git fetch origin main agent/qa-status-snapshot
          git checkout origin/main -- src/app/hooks/applySequenceEvent.ts
          git show origin/agent/qa-status-snapshot:.github/patches/authoritativeSnapshot.ts > src/app/flows/authoritativeSnapshot.ts
          git show origin/agent/qa-status-snapshot:.github/patches/localMoveHiddenPieces.test.ts > tests/unit/localMoveHiddenPieces.test.ts
          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path('src/app/controllers/useAuthoritativeGameSyncController.ts')
          content = path.read_text()
          anchor = "import { buildAuthoritativeApplyWakeSnapshot, shouldApplyAuthoritativeWake } from '../flows/authoritativeApplyWakeFlow';\n"
          helper_import = "import { getAuthoritativeSnapshot } from '../flows/authoritativeSnapshot';\n"
          if helper_import not in content:
              if anchor not in content:
                  raise SystemExit('controller import anchor not found')
              content = content.replace(anchor, anchor + helper_import, 1)
          content, removed = re.subn(
              r"const getAuthoritativeSnapshot = \(\n.*?\n\};\n\n",
              '',
              content,
              count=1,
              flags=re.S,
          )
          if removed != 1 and 'const getAuthoritativeSnapshot = (' in content:
              raise SystemExit('unexpected controller snapshot helper shape')
          content = content.replace(
              'getAuthoritativeSnapshot(value, null)',
              'getAuthoritativeSnapshot<SequenceStateSnapshot>(value, null)',
          )
          path.write_text(content)
          PY
      - run: npm ci
      - run: npm run qa:validate-architecture
      - run: npm run test:unit
      - name: Build
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -nE 'error TS|Error:|failed|Type ' build.log | tail -160 || tail -160 build.log
          else
            tail -40 build.log
          fi
          exit "$code"
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/controllers/useAuthoritativeGameSyncController.ts src/app/flows/authoritativeSnapshot.ts src/app/flows/localMoveOwnership.ts src/app/hooks/applySequenceEvent.ts tests/unit/localMoveHiddenPieces.test.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: preserve fallback state for partial authoritative results'
          git push origin HEAD:agent/fix-local-move-snapshot-pieces
