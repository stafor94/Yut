name: QA status snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: qa-status-snapshot
  cancel-in-progress: true

jobs:
  patch-and-validate:
    if: github.head_ref == 'agent/qa-status-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-local-move-snapshot-pieces
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve fallback state at subscription ingestion boundaries
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/app/controllers/useAuthoritativeGameSyncController.ts')
          content = path.read_text()

          old_remember = """  const rememberAndApplySyncedStateSnapshot = useCallback((state: SequenceStateSnapshot, options?: SnapshotApplyOptions) => {
            const roomId = params.activeRoomIdRef.current;
            const aliasedState = aliasTimeoutRollMutationIds(roomId, state);
            const classification = getDeliveryClassification(aliasedState);
          """.replace('          ', '')
          new_remember = """  const rememberAndApplySyncedStateSnapshot = useCallback((state: SequenceStateSnapshot, options?: SnapshotApplyOptions) => {
            const roomId = params.activeRoomIdRef.current;
            const rawAliasedState = aliasTimeoutRollMutationIds(roomId, state);
            const aliasedState = getAuthoritativeSnapshot(rawAliasedState, latestSyncedStateRef.current) ?? rawAliasedState;
            const classification = getDeliveryClassification(aliasedState);
          """.replace('          ', '')
          if old_remember not in content:
              raise SystemExit('rememberAndApplySyncedStateSnapshot marker not found')
          content = content.replace(old_remember, new_remember, 1)

          old_replay = """    replayMissingSequencesThenApply: async (state, localSequence, remoteSequence) => {
            const aliasedState = aliasTimeoutRollMutationIds(params.activeRoomId, state);
            const classification = getDeliveryClassification(aliasedState);
          """.replace('          ', '')
          new_replay = """    replayMissingSequencesThenApply: async (state, localSequence, remoteSequence) => {
            const rawAliasedState = aliasTimeoutRollMutationIds(params.activeRoomId, state);
            const aliasedState = getAuthoritativeSnapshot(rawAliasedState, latestSyncedStateRef.current) ?? rawAliasedState;
            const classification = getDeliveryClassification(aliasedState);
          """.replace('          ', '')
          if old_replay not in content:
              raise SystemExit('subscription replay marker not found')
          content = content.replace(old_replay, new_replay, 1)

          path.write_text(content)
          PY
      - run: npm ci
      - run: npm run qa:validate-architecture
      - run: npm run test:unit
      - run: npm run build
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/controllers/useAuthoritativeGameSyncController.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: preserve fallback state for subscription snapshots'
          git push origin HEAD:agent/fix-local-move-snapshot-pieces
