name: QA status snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: qa-status-snapshot
  cancel-in-progress: true

env:
  FIREBASE_TOOLS_VERSION: 15.24.0
  QA_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-stacked-hidden-pieces
  QA_PROJECT_ID: demo-yut-${{ github.run_id }}-${{ github.run_attempt }}-stacked-hidden-pieces

jobs:
  patch-and-validate:
    if: github.head_ref == 'agent/qa-status-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-local-move-snapshot-pieces
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preserve hidden pieces across stacked roll override
        run: |
          python3 <<'PY'
          from pathlib import Path

          reducer_path = Path('src/features/room/services/roomAuthoritativeReducerCore.ts')
          reducer = reducer_path.read_text()
          old_reducer = "    state: makeEngineState(stackedRoll ? { ...state, roll: stackedRoll } : state),"
          new_reducer = "    state: makeEngineState(stackedRoll ? { ...state, pieces: state.pieces, roll: stackedRoll } : state),"
          if old_reducer in reducer:
              reducer = reducer.replace(old_reducer, new_reducer, 1)
          elif new_reducer not in reducer:
              raise SystemExit('stacked roll reducer anchor not found')
          reducer_path.write_text(reducer)

          test_path = Path('tests/unit/localMoveHiddenPieces.test.ts')
          tests = test_path.read_text()
          test_name = 'keeps hidden local pieces when a stacked roll overrides roll'
          if test_name not in tests:
              tests += """


test('keeps hidden local pieces when a stacked roll overrides roll', () => {
  const firstMove = prepareLocalMoveOwnership({
    roomId: 'room-a',
    state: makeOnlineMoveState(),
    action: {
      type: 'move_piece',
      actorId: 'P1',
      payload: {
        pieceId: 'piece-1',
        extraSteps: 0,
        branchChoice: 'outer',
        rollStackIndex: null,
        clientActionId: `move_piece:P1:10:0:${MO}:5:hidden-stack-source`,
        clientActionStartedAt: Date.now(),
      },
    },
  });

  assert.ok(firstMove);
  const stackedState = getAuthoritativeSnapshot({
    stackedRollMode: true,
    roll: null,
    rollStack: [{ name: GEOL, steps: 3, bonus: false }],
    selectedRollStackIndex: 0,
    rollStackClosed: true,
    lastSequence: 11,
    turnVersion: 4,
  }, firstMove.finalState);
  assert.ok(stackedState);
  assert.equal(Object.prototype.hasOwnProperty.call(stackedState, 'pieces'), false);

  const stackedMove = prepareLocalMoveOwnership({
    roomId: 'room-a',
    state: stackedState,
    action: {
      type: 'move_piece',
      actorId: 'P1',
      payload: {
        pieceId: 'piece-1',
        extraSteps: 0,
        branchChoice: 'outer',
        rollStackIndex: 0,
        clientActionId: `move_piece:P1:11:0:${GEOL}:3:hidden-stack`,
        clientActionStartedAt: Date.now(),
      },
    },
  });

  assert.ok(stackedMove);
  assert.equal(stackedMove.record.fromNodeId, 'n06');
  assert.ok(stackedMove.record.pathNodeIds.length > 0);
  assert.equal(Object.prototype.propertyIsEnumerable.call(stackedMove.finalState, 'pieces'), false);
});
"""
          test_path.write_text(tests)

          history_path = Path('BUG_HISTORY.md')
          history = history_path.read_text()
          marker = '## 2026-08-02 - 누적 이동 스택에서 hidden pieces 유실'
          if marker not in history:
              history += """

---

## 2026-08-02 - 누적 이동 스택에서 hidden pieces 유실

### Symptom

- 로컬 이동 소유권 수정 branch의 전체 QA에서 Desktop Online core와 Mobile Galaxy의 누적 이동 스택 제한시간 복구가 동일하게 실패했다.
- 두 환경 모두 recovery sequence는 정확히 한 번 생성됐지만 브라우저에서 `TypeError: pieces is not iterable`가 발생해 게임 화면이 복구되지 않았다.

### Confirmed root cause

- 로컬 이동 결과의 `pieces`는 실행 클라이언트 화면에 authoritative final 위치가 다시 spread 적용되지 않도록 비열거 속성으로 유지하고 Symbol backup에 보존한다.
- 누적 이동 스택 reducer는 선택한 roll을 주입할 때 `{ ...state, roll: stackedRoll }`로 상태를 복사했다.
- object spread가 비열거 `pieces`를 제외하면서 `makeEngineState()`와 `reduceMoveCommand()`에 `pieces: undefined`가 전달됐다.
- 이전 guard는 reducer 호출 직전 원본 상태에서 배열 존재만 확인했기 때문에 reducer 내부의 두 번째 spread 유실을 감지하지 못했다.

### Fix

- 누적 roll override 상태를 만들 때 `pieces: state.pieces`를 명시적으로 다시 포함한다.
- hidden pieces 상태에서 `rollStackIndex`를 사용하는 로컬 이동을 실행하는 단위 회귀 테스트를 추가한다.

### Do not try again

- 테스트 timeout 증가, assertion 완화, 자동 이동 차단 또는 presentation 대기로 예외를 숨기지 않는다.
- local move final pieces를 다시 열거 속성으로 바꿔 실행 클라이언트 화면에 spread 적용하지 않는다.

### Verification checklist

- [ ] 신규 hidden pieces + stacked roll unit test 실행 및 성공
- [ ] 전체 unit tests 성공
- [ ] production build 성공
- [ ] QA architecture validation 성공
- [ ] 대상 Desktop stacked timeout Playwright 성공
- [ ] 대상 Mobile Galaxy stacked timeout Playwright 성공
- [ ] 전체 branch QA 성공
- [ ] 병합 후 Main Branch QA 성공
"""
          history_path.write_text(history)
          PY
      - run: npm ci
      - name: Validate QA architecture
        run: npm run qa:validate-architecture
      - name: Run unit tests
        run: npm run test:unit
      - name: Build production app
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare isolated QA Firebase environment
        run: node .github/scripts/write-qa-firebase-env.mjs
      - name: Reject production Firebase configuration
        run: node .github/scripts/verify-qa-emulator-config.mjs
      - name: Build isolated QA app
        run: npm run build:qa
      - name: Run targeted stacked timeout recovery QA
        run: |
          npx --yes firebase-tools@${FIREBASE_TOOLS_VERSION} emulators:exec \
            --config firebase.qa.json \
            --project "$QA_PROJECT_ID" \
            --only auth,firestore \
            "npx playwright test --workers=1 --project=desktop-chromium tests/game-flow/stacked-roll-timeout.spec.js && npx playwright test --workers=1 --project=mobile-galaxy tests/mobile/stacked-roll-timeout.spec.js"
      - name: Mark validated checks in bug history
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('BUG_HISTORY.md')
          text = path.read_text()
          for item in (
              '신규 hidden pieces + stacked roll unit test 실행 및 성공',
              '전체 unit tests 성공',
              'production build 성공',
              'QA architecture validation 성공',
              '대상 Desktop stacked timeout Playwright 성공',
              '대상 Mobile Galaxy stacked timeout Playwright 성공',
          ):
              text = text.replace(f'- [ ] {item}', f'- [x] {item}', 1)
          path.write_text(text)
          PY
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BUG_HISTORY.md src/features/room/services/roomAuthoritativeReducerCore.ts tests/unit/localMoveHiddenPieces.test.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: preserve hidden pieces in stacked move reduction'
          git push origin HEAD:agent/fix-local-move-snapshot-pieces
