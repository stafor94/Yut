name: QA status snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: qa-status-snapshot
  cancel-in-progress: true

jobs:
  report:
    if: github.head_ref == 'agent/qa-status-snapshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report target QA status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const config = JSON.parse(fs.readFileSync('.github/qa-status-snapshot.json', 'utf8'));
            const apiBase = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
            const headers = {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'yut-qa-status-snapshot',
            };
            async function request(path, options = {}) {
              const response = await fetch(`${apiBase}${path}`, {
                ...options,
                headers: { ...headers, ...(options.headers ?? {}) },
              });
              const text = await response.text();
              if (!response.ok) throw new Error(`${options.method ?? 'GET'} ${path}: ${response.status} ${text}`);
              return text ? JSON.parse(text) : null;
            }
            const query = new URLSearchParams({
              event: config.targetEvent,
              branch: config.targetRef,
              head_sha: config.targetSha,
              per_page: '10',
            });
            const data = await request(`/actions/workflows/qa.yml/runs?${query}`);
            const runs = (data.workflow_runs ?? [])
              .filter((run) => run.head_sha === config.targetSha)
              .map(({ id, status, conclusion, html_url, event, head_branch, head_sha }) => ({
                id,
                status,
                conclusion,
                html_url,
                event,
                head_branch,
                head_sha,
              }));
            const body = ['## QA status snapshot', '', '```json', JSON.stringify(runs, null, 2), '```'].join('\n');
            await request('/issues', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title: config.reportTitle, body }),
            });
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
