name: Safari fix run status probe

on:
  push:
    branches:
      - agent/safari-fix-run-probe

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Report latest fix verification run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=fix%2Fsafari-room-creation-deadline-watchdog&per_page=20")
          RUN=$(jq -c '[.workflow_runs[] | select(.name == "Safari room creation watchdog verification")][0] // {}' <<<"$RESPONSE")
          RUN_ID=$(jq -r '.id // empty' <<<"$RUN")
          if [ -z "$RUN_ID" ]; then
            gh pr comment 1107 --body "Fix verification Run을 아직 찾지 못했습니다. Probe: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            exit 0
          fi
          JOBS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | {id,name,status,conclusion}]')
          URL=$(jq -r '.html_url' <<<"$RUN")
          STATUS=$(jq -r '.status' <<<"$RUN")
          CONCLUSION=$(jq -r '.conclusion // "pending"' <<<"$RUN")
          SHA=$(jq -r '.head_sha' <<<"$RUN")
          ATTEMPT=$(jq -r '.run_attempt' <<<"$RUN")
          gh pr comment 1107 --body "Fix verification status: Run ID \`$RUN_ID\`, attempt \`$ATTEMPT\`, head \`$SHA\`, status/conclusion \`$STATUS/$CONCLUSION\`, URL: $URL, jobs: \`$JOBS\`. Probe: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
