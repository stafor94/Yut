name: Temporary P0 PR3 integration patch diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: temporary-p0-pr3-review-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose-patch:
    if: github.event.pull_request.head.ref == 'feat/p0-pr3-coordinator-lease-epoch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false
      - name: Capture patch diagnostics
        run: |
          set +e
          mkdir -p /tmp/p0-pr3-diagnostics
          wc -c .github/p0-pr3-review-fix.patch.xz.b64 > /tmp/p0-pr3-diagnostics/encoded-size.txt
          sha256sum .github/p0-pr3-review-fix.patch.xz.b64 > /tmp/p0-pr3-diagnostics/encoded-sha.txt
          base64 --decode .github/p0-pr3-review-fix.patch.xz.b64 > /tmp/p0-pr3-review-fix.patch.xz 2> /tmp/p0-pr3-diagnostics/base64-error.txt
          echo "$?" > /tmp/p0-pr3-diagnostics/base64-status.txt
          xz --decompress --stdout /tmp/p0-pr3-review-fix.patch.xz > /tmp/p0-pr3-review-fix.patch 2> /tmp/p0-pr3-diagnostics/xz-error.txt
          echo "$?" > /tmp/p0-pr3-diagnostics/xz-status.txt
          wc -c /tmp/p0-pr3-review-fix.patch > /tmp/p0-pr3-diagnostics/patch-size.txt
          sha256sum /tmp/p0-pr3-review-fix.patch > /tmp/p0-pr3-diagnostics/patch-sha.txt
          git apply --check /tmp/p0-pr3-review-fix.patch > /tmp/p0-pr3-diagnostics/apply-check.txt 2>&1
          echo "$?" > /tmp/p0-pr3-diagnostics/apply-status.txt
          sed -n '1,220p' /tmp/p0-pr3-review-fix.patch > /tmp/p0-pr3-diagnostics/patch-head.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: p0-pr3-review-patch-diagnostics
          path: /tmp/p0-pr3-diagnostics
          retention-days: 1
