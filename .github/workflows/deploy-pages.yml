name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [Main Branch QA]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Deploy GitHub Pages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-and-unit
          path: build-and-unit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify dist exists
        run: |
          test -d build-and-unit/dist
          ls -la build-and-unit/dist
      - uses: actions/configure-pages@v5
      - id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-and-unit/dist
      - id: deployment
        name: Deploy Pages within four-minute deadline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          PAGES_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          PAGES_DEPLOYMENT_TIMEOUT_MS: '240000'
        run: node .github/scripts/deploy-pages-with-deadline.mjs
