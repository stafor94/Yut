name: QA operations probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read

concurrency:
  group: qa-operations-probe
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dispatch full Main Branch QA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const config = JSON.parse(fs.readFileSync('.github/qa-operations-probe.json', 'utf8'));
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/qa.yml/dispatches`, {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'yut-qa-operations-probe',
              },
              body: JSON.stringify({ ref: config.ref }),
            });
            if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
