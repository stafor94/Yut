name: Main Branch QA

on:
  push:
    branches: [main, firebase-smooth-integration]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: main-branch-qa-${{ github.ref_name || github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_TOOLS_VERSION: 15.24.0

jobs:
  build-and-unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record job start
        run: echo "QA_JOB_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate QA architecture
        run: npm run qa:validate-architecture
      - name: Prepare canonical production Firebase environment
        run: node .github/scripts/write-firebase-env.mjs
      - name: Build app
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Unit tests
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee unit.log
      - name: Record build and unit timing
        if: always()
        run: |
          mkdir -p build
          COMPLETED_AT_MS=$(date +%s%3N)
          node -e "const fs=require('fs'); const startedAtMs=Number(process.argv[1]); const completedAtMs=Number(process.argv[2]); fs.writeFileSync('build/qa-job-timing.json', JSON.stringify({ code: 'build', label: 'Build and unit', startedAtMs, completedAtMs, durationMs: completedAtMs - startedAtMs }, null, 2) + '\n');" "$QA_JOB_STARTED_AT_MS" "$COMPLETED_AT_MS"
      - name: Upload app and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-unit-${{ github.run_attempt }}
          path: |
            dist
            build
            build.log
            unit.log
            test-results/qa-architecture-report.json
          if-no-files-found: ignore
          retention-days: 7

  qa-firebase-emulator:
    name: QA ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: online-core
            code: core
            label: Online core
            browsers: chromium
          - group: desktop-sequence
            code: seq
            label: Desktop sequence replay
            browsers: chromium
          - group: desktop-regression
            code: desk
            label: Desktop regression
            browsers: chromium
          - group: mobile-galaxy
            code: galaxy
            label: Mobile Galaxy
            browsers: chromium
          - group: mobile-galaxy-timing
            code: galtime
            label: Mobile Galaxy timing
            browsers: chromium
          - group: safari-visible-mismatch
            code: safvis
            label: Safari visible mismatch
            browsers: webkit
          - group: safari-timing
            code: safari
            label: Safari timing
            browsers: webkit
    env:
      QA_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.code }}
      QA_PROJECT_ID: demo-yut-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.code }}
    steps:
      - name: Record job start
        run: echo "QA_JOB_STARTED_AT_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}-${{ hashFiles('firebase.qa.json') }}
      - name: Install required Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browsers }}
      - name: Prepare isolated QA Firebase environment
        run: node .github/scripts/write-qa-firebase-env.mjs
      - name: Reject production Firebase configuration
        run: node .github/scripts/verify-qa-emulator-config.mjs
      - name: Build isolated QA app
        run: |
          set -o pipefail
          npm run build:qa 2>&1 | tee qa-build.log
      - id: emulator-qa
        name: Run ${{ matrix.label }} against Auth and Firestore emulators
        run: |
          set -o pipefail
          npx --yes firebase-tools@${FIREBASE_TOOLS_VERSION} emulators:exec \
            --config firebase.qa.json \
            --project "$QA_PROJECT_ID" \
            --only auth,firestore \
            "npm run qa:emulator-suite -- --group ${{ matrix.group }}" 2>&1 | tee qa-emulator-suite.log
      - name: Collect shard artifacts
        if: always()
        env:
          SHARD_CODE: ${{ matrix.code }}
          SHARD_GROUP: ${{ matrix.group }}
          SHARD_LABEL: ${{ matrix.label }}
          SHARD_RESULT: ${{ job.status }}
        run: |
          target="qa-artifacts/$SHARD_CODE"
          mkdir -p "$target"
          printf '%s\n' "$SHARD_GROUP" > "$target/group.txt"
          printf '%s\n' "$SHARD_RESULT" > "$target/result.txt"
          COMPLETED_AT_MS=$(date +%s%3N)
          node -e "const fs=require('fs'); const [code,label,started,completed]=process.argv.slice(1); const startedAtMs=Number(started); const completedAtMs=Number(completed); fs.writeFileSync(process.argv[5], JSON.stringify({ code, label, startedAtMs, completedAtMs, durationMs: completedAtMs - startedAtMs }, null, 2) + '\n');" "$SHARD_CODE" "$SHARD_LABEL" "$QA_JOB_STARTED_AT_MS" "$COMPLETED_AT_MS" "$target/qa-job-timing.json"
          for pattern in test-results playwright-*.log qa-*.log qa-duration.json firestore-debug.log firebase-debug.log console-log.txt; do
            for file in $pattern; do
              if [ -e "$file" ]; then
                cp -R "$file" "$target/"
              fi
            done
          done
      - name: Upload ${{ matrix.label }} artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.code }}-results-${{ github.run_attempt }}
          path: qa-artifacts
          if-no-files-found: ignore
          retention-days: 7

  summarize-qa-result:
    name: Summarize QA result
    if: always()
    needs: [build-and-unit, qa-firebase-emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download QA artifacts for current attempt
        uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ github.run_attempt }}'
          merge-multiple: true
        continue-on-error: true
      - id: performance
        name: Validate QA performance budget
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/validate-qa-performance.mjs
      - name: Write QA summary
        env:
          BUILD_RESULT: ${{ needs.build-and-unit.result }}
          EMULATOR_RESULT: ${{ needs.qa-firebase-emulator.result }}
        run: |
          CORE_RESULT=$(cat core/result.txt 2>/dev/null || printf 'unavailable')
          SEQUENCE_RESULT=$(cat seq/result.txt 2>/dev/null || printf 'unavailable')
          DESKTOP_RESULT=$(cat desk/result.txt 2>/dev/null || printf 'unavailable')
          GALAXY_RESULT=$(cat galaxy/result.txt 2>/dev/null || printf 'unavailable')
          GALAXY_TIMING_RESULT=$(cat galtime/result.txt 2>/dev/null || printf 'unavailable')
          SAFARI_VISIBLE_RESULT=$(cat safvis/result.txt 2>/dev/null || printf 'unavailable')
          SAFARI_RESULT=$(cat safari/result.txt 2>/dev/null || printf 'unavailable')
          duration() {
            node -e "const fs=require('fs'); try { const value=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); const ms=value.durations.reduce((sum, item) => sum + Number(item.durationMs || 0), 0); process.stdout.write((ms / 1000).toFixed(1) + 's'); } catch { process.stdout.write('unavailable'); }" "$1"
          }
          CORE_DURATION=$(duration core/qa-duration.json)
          SEQUENCE_DURATION=$(duration seq/qa-duration.json)
          DESKTOP_DURATION=$(duration desk/qa-duration.json)
          GALAXY_DURATION=$(duration galaxy/qa-duration.json)
          GALAXY_TIMING_DURATION=$(duration galtime/qa-duration.json)
          SAFARI_VISIBLE_DURATION=$(duration safvis/qa-duration.json)
          SAFARI_DURATION=$(duration safari/qa-duration.json)
          {
            echo '## Main Branch QA 결과'
            echo
            echo '| 단계 | 결과 | 테스트 실행 시간 |'
            echo '|---|---|---:|'
            echo "| Build and unit | \`$BUILD_RESULT\` | - |"
            echo "| QA online core | \`$CORE_RESULT\` | $CORE_DURATION |"
            echo "| QA desktop sequence replay | \`$SEQUENCE_RESULT\` | $SEQUENCE_DURATION |"
            echo "| QA desktop regression | \`$DESKTOP_RESULT\` | $DESKTOP_DURATION |"
            echo "| QA mobile Galaxy | \`$GALAXY_RESULT\` | $GALAXY_DURATION |"
            echo "| QA mobile Galaxy timing | \`$GALAXY_TIMING_RESULT\` | $GALAXY_TIMING_DURATION |"
            echo "| QA Safari visible mismatch | \`$SAFARI_VISIBLE_RESULT\` | $SAFARI_VISIBLE_DURATION |"
            echo "| QA Safari timing | \`$SAFARI_RESULT\` | $SAFARI_DURATION |"
            echo "| Firebase emulator QA matrix | \`$EMULATOR_RESULT\` | - |"
          } | tee qa-summary.md
          cat qa-summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f qa-performance.md ]; then
            cat qa-performance.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Combine QA logs
        if: always()
        run: find core seq desk galaxy galtime safvis safari -type f \( -name 'playwright-*.log' -o -name 'qa-*.log' \) -print0 2>/dev/null | xargs -0 cat > playwright.log || touch playwright.log
      - name: Upload QA summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-summary-${{ github.run_attempt }}
          path: |
            build
            core
            seq
            desk
            galaxy
            galtime
            safvis
            safari
            build.log
            unit.log
            test-results/qa-architecture-report.json
            playwright.log
            qa-summary.md
            qa-performance.json
            qa-performance.md
            console-log.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail when a required stage failed
        env:
          BUILD_RESULT: ${{ needs.build-and-unit.result }}
          EMULATOR_RESULT: ${{ needs.qa-firebase-emulator.result }}
          PERFORMANCE_RESULT: ${{ steps.performance.outcome }}
        run: |
          test "$BUILD_RESULT" = success
          test "$EMULATOR_RESULT" = success
          test "$PERFORMANCE_RESULT" = success
