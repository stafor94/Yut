name: Remote fall turn order fixture verification

on:
  push:
    branches:
      - fix/remote-fall-turn-order-fixture

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: remote-fall-turn-order-fixture-verify
  cancel-in-progress: true

env:
  FIREBASE_TOOLS_VERSION: 15.24.0
  QA_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-desk-fix
  QA_PROJECT_ID: demo-yut-${{ github.run_id }}-${{ github.run_attempt }}-desk-fix

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Apply deterministic QA fixture patch
        run: node scripts/apply-remote-fall-turn-order-fixture.mjs
      - name: Validate source and build
        shell: bash
        run: |
          git diff --check
          npm run qa:validate-architecture
          npm run build
          npm run test:unit
      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}-${{ hashFiles('firebase.qa.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare isolated QA environment
        shell: bash
        run: |
          node .github/scripts/write-qa-firebase-env.mjs
          node .github/scripts/verify-qa-emulator-config.mjs
          npm run build:qa
      - name: Run Desktop regression QA
        shell: bash
        run: |
          set -o pipefail
          npx --yes firebase-tools@${FIREBASE_TOOLS_VERSION} emulators:exec \
            --config firebase.qa.json \
            --project "$QA_PROJECT_ID" \
            --only auth,firestore \
            "npm run qa:emulator-suite -- --group desktop-regression" 2>&1 | tee remote-fall-fixture-qa.log
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-fall-turn-order-fixture-results
          path: |
            remote-fall-fixture-qa.log
            test-results
            playwright-*.log
            qa-*.log
            firestore-debug.log
            firebase-debug.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit verified changes
        if: success()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Stabilize remote fall turn order fixture"
          git push origin HEAD
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 1106 --body "Desktop regression fix verification succeeded. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT), head: $GITHUB_SHA. Build/typecheck, unit, architecture, and full Desktop regression emulator QA passed."
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment 1106 --body "Desktop regression fix verification failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT), head: $GITHUB_SHA. Inspect artifacts before changing the fixture."
