name: QA artifact inspector

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: qa-artifact-inspector
  cancel-in-progress: true

jobs:
  patch-and-validate:
    if: github.head_ref == 'agent/qa-status-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-local-move-snapshot-pieces
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply staged patch
        run: |
          git fetch origin agent/qa-status-snapshot
          git show origin/agent/qa-status-snapshot:.github/patches/apply-local-move-fallback.py > /tmp/apply-local-move-fallback.py
          python3 /tmp/apply-local-move-fallback.py
      - run: npm ci
      - run: npm run qa:validate-architecture
      - run: npm run test:unit
      - run: npm run build
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/flows/localMoveOwnership.ts tests/unit/localMoveHiddenPieces.test.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: restore enumerable pieces for move reducer input'
          git push origin HEAD:agent/fix-local-move-snapshot-pieces
