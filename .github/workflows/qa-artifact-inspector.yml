name: QA artifact inspector

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download failed Safari artifact
        uses: actions/download-artifact@v4
        with:
          name: qa-safvis-results
          path: inspected-artifact
          repository: stafor94/Yut
          run-id: 30736809205
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Summarize failed artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          (async () => {
            const root = path.resolve('inspected-artifact');
            const files = [];
            function walk(directory) {
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const full = path.join(directory, entry.name);
                if (entry.isDirectory()) walk(full);
                else files.push(full);
              }
            }
            walk(root);
            function clipped(file, limit = 16000) {
              const text = fs.readFileSync(file, 'utf8');
              return text.length <= limit ? text : text.slice(-limit);
            }
            const sections = [];
            for (const file of files.filter((candidate) => candidate.endsWith('error-context.md'))) {
              sections.push(`### ${path.relative(root, file)}\n\n\`\`\`text\n${clipped(file)}\n\`\`\``);
            }
            for (const file of files.filter((candidate) => /(?:console-log\.txt|playwright-.*\.log)$/u.test(candidate))) {
              sections.push(`### ${path.relative(root, file)}\n\n\`\`\`text\n${clipped(file, 12000)}\n\`\`\``);
            }
            for (const file of files.filter((candidate) => candidate.endsWith('trace.zip'))) {
              let listing = '';
              let matched = '';
              try {
                listing = execFileSync('unzip', ['-l', file], { encoding: 'utf8' });
                const traceName = execFileSync('unzip', ['-Z1', file], { encoding: 'utf8' })
                  .split('\n')
                  .find((name) => name.endsWith('trace.trace'));
                if (traceName) {
                  const trace = execFileSync('unzip', ['-p', file, traceName], {
                    encoding: 'utf8',
                    maxBuffer: 50 * 1024 * 1024,
                  });
                  matched = trace
                    .split('\n')
                    .filter((line) => /room|방 생성|create-room|activeRoomId|alertdialog|waiting-room|Firestore|permission|error/iu.test(line))
                    .slice(-160)
                    .join('\n');
                }
              } catch (error) {
                matched = `trace inspection failed: ${error instanceof Error ? error.message : String(error)}`;
              }
              sections.push(`### ${path.relative(root, file)} listing\n\n\`\`\`text\n${listing.slice(-12000)}\n\`\`\``);
              sections.push(`### ${path.relative(root, file)} matched events\n\n\`\`\`jsonl\n${matched.slice(-24000)}\n\`\`\``);
            }
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/issues`, {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'yut-qa-artifact-inspector',
              },
              body: JSON.stringify({
                title: '[QA artifact] Safari visible mismatch bootstrap failure',
                body: ['## Failed QA artifact inspection', '', ...sections].join('\n\n').slice(0, 64000),
              }),
            });
            if (!response.ok) throw new Error(`issue create failed: ${response.status} ${await response.text()}`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
