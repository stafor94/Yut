name: Safari room creation watchdog verification

on:
  push:
    branches:
      - fix/safari-room-creation-deadline-watchdog

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: safari-room-creation-fix-verify
  cancel-in-progress: true

env:
  FIREBASE_TOOLS_VERSION: 15.24.0
  QA_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-safari-fix
  QA_PROJECT_ID: demo-yut-${{ github.run_id }}-${{ github.run_attempt }}-safari-fix

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Report verification start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1107 --body "Focused verification started. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT), head: $GITHUB_SHA."
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Validate source and build
        run: |
          git diff --check origin/main...HEAD
          npm run qa:validate-architecture
          npm run build
      - name: Run unit tests
        run: npm run test:unit
      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}-${{ hashFiles('firebase.qa.json') }}
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Prepare isolated QA environment
        run: |
          node .github/scripts/write-qa-firebase-env.mjs
          node .github/scripts/verify-qa-emulator-config.mjs
          npm run build:qa
      - name: Run focused Safari timing QA
        run: |
          set -o pipefail
          npx --yes firebase-tools@${FIREBASE_TOOLS_VERSION} emulators:exec \
            --config firebase.qa.json \
            --project "$QA_PROJECT_ID" \
            --only auth,firestore \
            "npm run qa:emulator-suite -- --group safari-timing" 2>&1 | tee safari-fix-qa.log
      - name: Upload focused QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-room-creation-fix-results
          path: |
            safari-fix-qa.log
            test-results
            playwright-*.log
            qa-*.log
            firestore-debug.log
            firebase-debug.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary verification workflow
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/safari-room-creation-fix-verify.yml
          git commit -m "Remove temporary Safari fix verification workflow"
          git push origin HEAD
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1107 --body "Focused verification succeeded. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT). Build/typecheck, full unit, architecture validation, and Safari timing emulator QA all passed. The temporary workflow was removed from the PR branch."
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1107 --body "Focused verification failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT). Inspect the failed step and uploaded Safari artifacts before modifying the fix."
