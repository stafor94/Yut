name: Main protection applier

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: main-protection-applier-pr1333
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/qa-run-inspector-pr1333'
    runs-on: ubuntu-latest
    steps:
      - name: Apply and verify main branch protection
        env:
          ADMIN_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN || secrets.GH_PAT || secrets.PAT || github.token }}
          ISSUE_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async () => {
            const repo = process.env.GITHUB_REPOSITORY;
            const api = `https://api.github.com/repos/${repo}`;
            const requiredContext = 'PR Required QA / Validate PR';
            const headers = (token) => ({
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'yut-main-protection-applier',
            });
            const adminHeaders = headers(process.env.ADMIN_TOKEN);
            const issueHeaders = headers(process.env.ISSUE_TOKEN);
            const protectionUrl = `${api}/branches/main/protection`;

            const initialResponse = await fetch(protectionUrl, { headers: adminHeaders });
            let current = null;
            if (initialResponse.status === 200) current = await initialResponse.json();
            else if (initialResponse.status !== 404) throw new Error(`protection read failed: ${initialResponse.status} ${await initialResponse.text()}`);

            const identities = (items, key) => Array.isArray(items) ? items.map((item) => typeof item === 'string' ? item : item?.[key]).filter(Boolean) : [];
            const currentReviews = current?.required_pull_request_reviews ?? {};
            const dismissal = currentReviews.dismissal_restrictions ?? {};
            const bypass = currentReviews.bypass_pull_request_allowances ?? {};
            const restrictions = current?.restrictions
              ? {
                  users: identities(current.restrictions.users, 'login'),
                  teams: identities(current.restrictions.teams, 'slug'),
                  apps: identities(current.restrictions.apps, 'slug'),
                }
              : null;
            const enabled = (value, fallback = false) => typeof value?.enabled === 'boolean' ? value.enabled : fallback;

            const payload = {
              required_status_checks: {
                strict: true,
                contexts: [requiredContext],
              },
              enforce_admins: true,
              required_pull_request_reviews: {
                dismissal_restrictions: {
                  users: identities(dismissal.users, 'login'),
                  teams: identities(dismissal.teams, 'slug'),
                  apps: identities(dismissal.apps, 'slug'),
                },
                dismiss_stale_reviews: true,
                require_code_owner_reviews: true,
                required_approving_review_count: 1,
                require_last_push_approval: Boolean(currentReviews.require_last_push_approval),
                bypass_pull_request_allowances: {
                  users: identities(bypass.users, 'login'),
                  teams: identities(bypass.teams, 'slug'),
                  apps: identities(bypass.apps, 'slug'),
                },
              },
              restrictions,
              required_linear_history: enabled(current?.required_linear_history),
              allow_force_pushes: false,
              allow_deletions: false,
              block_creations: enabled(current?.block_creations),
              required_conversation_resolution: enabled(current?.required_conversation_resolution),
              lock_branch: enabled(current?.lock_branch),
              allow_fork_syncing: enabled(current?.allow_fork_syncing),
            };

            const updateResponse = await fetch(protectionUrl, {
              method: 'PUT',
              headers: adminHeaders,
              body: JSON.stringify(payload),
            });
            if (!updateResponse.ok) throw new Error(`protection update failed: ${updateResponse.status} ${await updateResponse.text()}`);

            const verifyResponse = await fetch(protectionUrl, { headers: adminHeaders });
            if (!verifyResponse.ok) throw new Error(`protection verification read failed: ${verifyResponse.status} ${await verifyResponse.text()}`);
            const verified = await verifyResponse.json();
            const contexts = verified.required_status_checks?.contexts ?? [];
            const checks = verified.required_status_checks?.checks ?? [];
            const effectiveContexts = contexts.length ? contexts : checks.map((check) => check.context);
            const summary = {
              branch: 'main',
              required_status_checks: {
                strict: Boolean(verified.required_status_checks?.strict),
                contexts: effectiveContexts,
              },
              required_pull_request_reviews: {
                dismiss_stale_reviews: Boolean(verified.required_pull_request_reviews?.dismiss_stale_reviews),
                require_code_owner_reviews: Boolean(verified.required_pull_request_reviews?.require_code_owner_reviews),
                required_approving_review_count: Number(verified.required_pull_request_reviews?.required_approving_review_count ?? 0),
              },
              enforce_admins: Boolean(verified.enforce_admins?.enabled),
              allow_force_pushes: Boolean(verified.allow_force_pushes?.enabled),
              allow_deletions: Boolean(verified.allow_deletions?.enabled),
            };
            const valid = summary.required_status_checks.strict
              && summary.required_status_checks.contexts.length === 1
              && summary.required_status_checks.contexts[0] === requiredContext
              && summary.required_pull_request_reviews.dismiss_stale_reviews
              && summary.required_pull_request_reviews.require_code_owner_reviews
              && summary.required_pull_request_reviews.required_approving_review_count === 1
              && summary.enforce_admins
              && !summary.allow_force_pushes
              && !summary.allow_deletions;
            if (!valid) throw new Error(`protection verification mismatch: ${JSON.stringify(summary)}`);

            const issueResponse = await fetch(`${api}/issues`, {
              method: 'POST',
              headers: issueHeaders,
              body: JSON.stringify({
                title: '[Protection] main PR Required QA enforced',
                body: `## Verified main protection\n\n\`\`\`json\n${JSON.stringify(summary, null, 2)}\n\`\`\``,
              }),
            });
            if (!issueResponse.ok) throw new Error(`protection report issue failed: ${issueResponse.status} ${await issueResponse.text()}`);
          })().catch(async (error) => {
            console.error(error);
            try {
              const api = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
              await fetch(`${api}/issues`, {
                method: 'POST',
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${process.env.ISSUE_TOKEN}`,
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'yut-main-protection-applier',
                },
                body: JSON.stringify({
                  title: '[Protection] main protection apply failed',
                  body: `## Failure\n\n\`\`\`\n${String(error)}\n\`\`\``,
                }),
              });
            } catch {}
            process.exitCode = 1;
          });
          NODE
