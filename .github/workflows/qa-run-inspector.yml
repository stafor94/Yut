name: QA run inspector

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: qa-run-inspector-pr1333
  cancel-in-progress: true

jobs:
  report:
    if: github.head_ref == 'agent/qa-run-inspector-pr1333'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report target QA run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const config = JSON.parse(fs.readFileSync('.github/qa-run-inspector.json', 'utf8'));
            const base = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}`;
            const headers = {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'yut-qa-run-inspector',
            };
            const query = new URLSearchParams({
              event: config.targetEvent,
              branch: config.targetRef,
              head_sha: config.targetSha,
              per_page: '10',
            });
            const response = await fetch(`${base}/actions/workflows/${config.workflow}/runs?${query}`, { headers });
            if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
            const data = await response.json();
            const runs = (data.workflow_runs ?? [])
              .filter((run) => run.head_sha === config.targetSha)
              .map((run) => ({
                id: run.id,
                status: run.status,
                conclusion: run.conclusion,
                event: run.event,
                head_branch: run.head_branch,
                head_sha: run.head_sha,
                html_url: run.html_url,
              }));
            const created = await fetch(`${base}/issues`, {
              method: 'POST',
              headers,
              body: JSON.stringify({
                title: config.reportTitle,
                body: `## QA status snapshot\n\n\`\`\`json\n${JSON.stringify(runs, null, 2)}\n\`\`\``,
              }),
            });
            if (!created.ok) throw new Error(`${created.status} ${await created.text()}`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
