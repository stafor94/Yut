name: Temporary P0 PR3 source export

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-source:
    if: github.event.pull_request.head.ref == 'feat/p0-pr3-coordinator-lease-epoch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Archive tracked source snapshot
        run: git ls-files -z | tar --null -T - -czf source-snapshot.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: p0-pr3-source-${{ github.event.pull_request.head.sha }}
          path: source-snapshot.tar.gz
          retention-days: 1
