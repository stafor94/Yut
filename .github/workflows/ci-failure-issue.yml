name: Main QA Failure Issue

on:
  workflow_run:
    workflows: ["Main Branch QA"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  sync-ci-failure-issue:
    name: Sync CI failure issues
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download source QA summary
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qa-summary
          path: source-qa-summary
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Sync fingerprinted CI failure issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: node .github/scripts/qa-failure-fingerprint.mjs --sync source-qa-summary/qa-failure-report.json
