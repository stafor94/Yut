name: Temporary P0 build diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: temporary-p0-pr2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose-build:
    if: github.event.pull_request.head.ref == 'perf/p0-pr2-leaf-display-clocks'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false
      - name: Restore and apply product patch
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          encoded = Path('.github/p0-pr2-product.patch.gz.b64').read_text()
          encoded = encoded[:8629] + 'h' + encoded[8629:]
          assert sha256(encoded.encode()).hexdigest() == 'ce91d634dde1947cb549396d1c4c51f7385313794f62a9b40bf0ce86f85ba6e2'
          Path('/tmp/p0-pr2-product.patch.gz.b64').write_text(encoded)
          PY
          base64 --decode /tmp/p0-pr2-product.patch.gz.b64 | gzip --decompress > /tmp/p0-pr2.patch
          git apply /tmp/p0-pr2.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture build result
        run: |
          set +e
          npm run build > /tmp/p0-pr2-build.log 2>&1
          status=$?
          echo "$status" > /tmp/p0-pr2-build.status
          cat /tmp/p0-pr2-build.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: p0-pr2-build-diagnostics
          path: |
            /tmp/p0-pr2-build.log
            /tmp/p0-pr2-build.status
          retention-days: 1
