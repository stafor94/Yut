name: Temporary P0 patch diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: temporary-p0-pr2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose-patch:
    if: github.event.pull_request.head.ref == 'perf/p0-pr2-leaf-display-clocks'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false
      - name: Diagnose product patch
        run: |
          set +e
          {
            wc -c .github/p0-pr2-product.patch.gz.b64
            sha256sum .github/p0-pr2-product.patch.gz.b64
            base64 --decode .github/p0-pr2-product.patch.gz.b64 | gzip --decompress > /tmp/p0-pr2.patch
            echo "decode_status=$?"
            wc -c /tmp/p0-pr2.patch
            git apply --check --verbose /tmp/p0-pr2.patch
            echo "apply_status=$?"
          } > /tmp/p0-pr2-apply.log 2>&1
          cat /tmp/p0-pr2-apply.log
      - uses: actions/upload-artifact@v4
        with:
          name: p0-pr2-patch-diagnostics
          path: |
            /tmp/p0-pr2-apply.log
            .github/p0-pr2-product.patch.gz.b64
          retention-days: 1
