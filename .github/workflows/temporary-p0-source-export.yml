name: Temporary P0 implementation validation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: temporary-p0-pr2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'perf/p0-pr2-leaf-display-clocks'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false
      - name: Restore and apply P0 PR2 patches
        run: |
          set -euxo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          encoded = Path('.github/p0-pr2-product.patch.gz.b64').read_text()
          assert len(encoded) == 10403
          encoded = encoded[:8629] + 'h' + encoded[8629:]
          assert sha256(encoded.encode()).hexdigest() == 'ce91d634dde1947cb549396d1c4c51f7385313794f62a9b40bf0ce86f85ba6e2'
          Path('/tmp/p0-pr2-product.patch.gz.b64').write_text(encoded)

          new_files = Path('.github/p0-pr2-new-files.patch.gz.b64').read_text()
          assert len(new_files) == 1968
          assert sha256(new_files.encode()).hexdigest() == '91b41d8b2fd39c98329090bacf5b441bcb1274e6e4af6342cb9fcd66f874e40b'
          PY
          base64 --decode /tmp/p0-pr2-product.patch.gz.b64 | gzip --decompress > /tmp/p0-pr2-product.patch
          echo '74519c548c4f43e9543d5b6dac3ee133715b4db6e41b9c8346390d1ce5a42205  /tmp/p0-pr2-product.patch' | sha256sum --check
          base64 --decode .github/p0-pr2-new-files.patch.gz.b64 | gzip --decompress > /tmp/p0-pr2-new-files.patch
          echo '34340c616bc1781f7ff5fa515994368fbcb6fea78113a5f59ab002f1d5b1141a  /tmp/p0-pr2-new-files.patch' | sha256sum --check
          git apply --check /tmp/p0-pr2-product.patch
          git apply /tmp/p0-pr2-product.patch
          git apply --check /tmp/p0-pr2-new-files.patch
          git apply /tmp/p0-pr2-new-files.patch
          rm .github/p0-pr2-product.patch.gz.b64
          rm .github/p0-pr2-new-files.patch.gz.b64
          rm .github/workflows/temporary-p0-source-export.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate QA architecture
        run: npm run qa:validate-architecture
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Verify App root display clock wiring
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const source = fs.readFileSync('src/app/App.tsx', 'utf8');
          for (const setter of ['setPlayTimeNow', 'setTurnOrderClock', 'setRollLockClock', 'setTrapPlacementClock', 'setItemPickupClock']) {
            assert.equal(source.includes(setter), false, `${setter} remains in App root`);
          }
          assert.equal(source.includes('useDeadlineReached(rollLockUntil)'), true);
          assert.equal(source.includes('setRollResultReadyAt(0)'), true);
          NODE
      - name: Commit validated product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: move display clocks out of App root'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
