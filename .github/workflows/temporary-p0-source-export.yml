name: Temporary P0 implementation validation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: temporary-p0-pr2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'perf/p0-pr2-leaf-display-clocks'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Apply P0 PR2 product patch
        run: |
          set -euxo pipefail
          base64 --decode .github/p0-pr2-product.patch.gz.b64 | gzip --decompress > /tmp/p0-pr2.patch
          git apply --check /tmp/p0-pr2.patch
          git apply /tmp/p0-pr2.patch
          rm .github/p0-pr2-product.patch.gz.b64
          rm .github/workflows/temporary-p0-source-export.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate QA architecture
        run: npm run qa:validate-architecture
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Verify App root display clock wiring
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const source = fs.readFileSync('src/app/App.tsx', 'utf8');
          for (const setter of ['setPlayTimeNow', 'setTurnOrderClock', 'setRollLockClock', 'setTrapPlacementClock', 'setItemPickupClock']) assert.equal(source.includes(setter), false, `${setter} remains in App root`);
          assert.equal(source.includes('useDeadlineReached(rollLockUntil)'), true);
          assert.equal(source.includes('setRollResultReadyAt(0)'), true);
          NODE
      - name: Commit validated product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: move display clocks out of App root'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
