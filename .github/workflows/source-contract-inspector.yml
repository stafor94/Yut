name: Source contract inspector

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7b0828022b45c4784a9826b8a306956f062ab12
      - name: Locate local move ownership call site
        run: |
          grep -RIn -C 20 --exclude-dir=node_modules --exclude-dir=dist "prepareLocalMoveOwnership\|localMoveLedger\|registerLocalMove" src > /tmp/local-move-callsite.txt || true
          cat /tmp/local-move-callsite.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish source context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const output = fs.readFileSync('/tmp/local-move-callsite.txt', 'utf8');
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/issues`, {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'yut-source-contract-inspector',
              },
              body: JSON.stringify({
                title: '[Source contract] Local move ownership call site',
                body: `## Local move ownership call site\n\n\`\`\`text\n${output.slice(0, 60000)}\n\`\`\``,
              }),
            });
            if (!response.ok) throw new Error(`issue create failed: ${response.status} ${await response.text()}`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
