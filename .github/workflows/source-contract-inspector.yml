name: Source contract inspector

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-local-move-snapshot-pieces
      - name: Locate timeout move state contracts
        run: |
          {
            echo '### resolveMoveTimeout and timeout recovery call sites'
            grep -RInE -C 24 --exclude-dir=node_modules --exclude-dir=dist 'resolveMoveTimeout\(|resolveMoveTimeoutContext\(|recoveredByCoordinator|timeoutDeadlineAt|makeTimeoutActionKey' src || true
            echo
            echo '### local move final state consumers'
            grep -RInE -C 24 --exclude-dir=node_modules --exclude-dir=dist 'localMoveLedger|finalState|prepareLocalMoveOwnership|stateSnapshotRef|fallbackState' src/app src/features/room || true
          } > /tmp/source-contract.txt
          cat /tmp/source-contract.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish source context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const output = fs.readFileSync('/tmp/source-contract.txt', 'utf8');
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/issues`, {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'yut-source-contract-inspector',
              },
              body: JSON.stringify({
                title: '[Source contract] Timeout move pieces call sites',
                body: `## Timeout move source contracts\n\n\`\`\`text\n${output.slice(0, 62000)}\n\`\`\``,
              }),
            });
            if (!response.ok) throw new Error(`issue create failed: ${response.status} ${await response.text()}`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
