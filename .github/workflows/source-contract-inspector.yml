name: Source contract inspector

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: source-contract-inspector
  cancel-in-progress: true

jobs:
  patch-and-validate:
    if: github.head_ref == 'agent/qa-status-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-local-move-snapshot-pieces
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply confirmed snapshot boundary fix
        run: |
          git fetch origin main
          git checkout origin/main -- src/app/hooks/applySequenceEvent.ts
          python3 <<'PY'
          from pathlib import Path

          controller_path = Path('src/app/controllers/useAuthoritativeGameSyncController.ts')
          controller = controller_path.read_text()
          import_anchor = "import { buildAuthoritativeApplyWakeSnapshot, shouldApplyAuthoritativeWake } from '../flows/authoritativeApplyWakeFlow';\n"
          helper_import = "import { getAuthoritativeSnapshot } from '../flows/authoritativeSnapshot';\n"
          if helper_import not in controller:
              if import_anchor not in controller:
                  raise SystemExit('controller import anchor not found')
              controller = controller.replace(import_anchor, import_anchor + helper_import, 1)

          old_helper = """const getAuthoritativeSnapshot = (
            value: unknown,
            fallback: SequenceStateSnapshot | null,
          ): SequenceStateSnapshot | null => {
            if (!value || typeof value !== 'object' || Array.isArray(value)) return fallback;
            const record = value as Record<string, unknown>;
            if (record.stateAfter && typeof record.stateAfter === 'object' && !Array.isArray(record.stateAfter)) {
              return record.stateAfter as SequenceStateSnapshot;
            }
            if (record.patch && typeof record.patch === 'object' && !Array.isArray(record.patch) && fallback) {
              return { ...fallback, ...(record.patch as SequenceStateSnapshot) };
            }
            if ('pieces' in record || 'lastSequence' in record || 'turnVersion' in record) {
              return record as SequenceStateSnapshot;
            }
            return fallback;
          };

          """.replace('          ', '')
          if old_helper in controller:
              controller = controller.replace(old_helper, '', 1)
          elif 'const getAuthoritativeSnapshot = (' in controller:
              raise SystemExit('unexpected controller snapshot helper shape')
          controller_path.write_text(controller)

          Path('src/app/flows/authoritativeSnapshot.ts').write_text("""import type { SequenceStateSnapshot } from '../appState';

const mergePartialSnapshot = (
  snapshot: SequenceStateSnapshot,
  fallback: SequenceStateSnapshot | null,
): SequenceStateSnapshot => {
  if (Array.isArray(snapshot.pieces) || !fallback) return snapshot;
  return { ...fallback, ...snapshot } as SequenceStateSnapshot;
};

export function getAuthoritativeSnapshot(
  value: unknown,
  fallback: SequenceStateSnapshot | null,
): SequenceStateSnapshot | null {
  if (!value || typeof value !== 'object' || Array.isArray(value)) return fallback;
  const record = value as Record<string, unknown>;
  if (record.stateAfter && typeof record.stateAfter === 'object' && !Array.isArray(record.stateAfter)) {
    return mergePartialSnapshot(record.stateAfter as SequenceStateSnapshot, fallback);
  }
  if (record.patch && typeof record.patch === 'object' && !Array.isArray(record.patch)) {
    return mergePartialSnapshot(record.patch as SequenceStateSnapshot, fallback);
  }
  if ('pieces' in record || 'lastSequence' in record || 'turnVersion' in record) {
    return mergePartialSnapshot(record as SequenceStateSnapshot, fallback);
  }
  return fallback;
}
""")

          Path('tests/unit/localMoveHiddenPieces.test.ts').write_text("""import assert from 'node:assert/strict';
import test from 'node:test';
import { getAuthoritativeSnapshot } from '../../src/app/flows/authoritativeSnapshot';
import { prepareLocalMoveOwnership } from '../../src/app/flows/localMoveOwnership';
import { TURN_ACTION_TIMEOUT_MS } from '../../src/features/room/services/roomTiming';

const makeOnlineMoveState = () => ({
  playMode: 'individual' as const,
  pieceCount: 1 as const,
  stackedRollMode: false,
  gameSeats: [
    { id: 'P1', team: '청팀' as const },
    { id: 'P2', team: '홍팀' as const },
  ],
  turnOrderIds: ['P1', 'P2'],
  turnIndex: 0,
  pieces: [
    { id: 'piece-1', ownerId: 'P1', nodeId: 'n01', nodeIndex: 0, started: false, finished: false, previousNodeId: '' },
    { id: 'piece-2', ownerId: 'P2', nodeId: 'n01', nodeIndex: 0, started: false, finished: false, previousNodeId: '' },
  ],
  roll: { name: '모', steps: 5, bonus: true },
  rollStack: [],
  selectedRollStackIndex: null,
  rollStackClosed: false,
  branchChoice: 'outer',
  boardItems: [],
  ownedItems: {},
  trapNodes: [],
  shieldedPieceIds: [],
  logs: [],
  lastMovedPieceIds: [],
  lastMovedSeatId: '',
  pendingItemPickup: null,
  itemPromptTiming: null,
  pendingAfterMoveTurnIndex: null,
  pendingGoldenYutSelection: null,
  pendingTrapPlacement: null,
  completedSeatIds: [],
  rankingSeatIds: [],
  gameEndMode: '',
  lastFinishedSeatId: '',
  winner: '',
  autoPlayBySeatId: {},
  turnActionTimeoutCountBySeatId: {},
  turnDeadlineKind: 'move',
  turnDeadlineAt: Date.now() + TURN_ACTION_TIMEOUT_MS,
  lastSequence: 10,
  turnVersion: 3,
});

test('부분 authoritative 결과 이후에도 숨긴 로컬 pieces로 다음 이동을 계산한다', () => {
  const firstMove = prepareLocalMoveOwnership({
    roomId: 'room-a',
    state: makeOnlineMoveState(),
    action: {
      type: 'move_piece',
      actorId: 'P1',
      payload: {
        pieceId: 'piece-1',
        extraSteps: 0,
        branchChoice: 'outer',
        rollStackIndex: null,
        clientActionId: 'move_piece:P1:10:0:모:5:first',
        clientActionStartedAt: Date.now(),
      },
    },
  });

  assert.ok(firstMove);
  assert.equal(firstMove.record.toNodeId, 'n06');
  assert.equal(Object.prototype.propertyIsEnumerable.call(firstMove.finalState, 'pieces'), false);

  const partialAppliedState = getAuthoritativeSnapshot({
    roll: { name: '걸', steps: 3, bonus: false },
    branchChoice: 'shortcut',
    lastSequence: 12,
    turnVersion: 4,
  }, firstMove.finalState);
  assert.ok(partialAppliedState);
  assert.equal(Object.prototype.hasOwnProperty.call(partialAppliedState, 'pieces'), false);

  const secondMove = prepareLocalMoveOwnership({
    roomId: 'room-a',
    state: partialAppliedState,
    action: {
      type: 'move_piece',
      actorId: 'P1',
      payload: {
        pieceId: 'piece-1',
        extraSteps: 0,
        branchChoice: 'shortcut',
        rollStackIndex: null,
        clientActionId: 'move_piece:P1:12:0:걸:3:second',
        clientActionStartedAt: Date.now(),
      },
    },
  });

  assert.ok(secondMove);
  assert.equal(secondMove.record.fromNodeId, 'n06');
  assert.ok(secondMove.record.pathNodeIds.length > 0);
  assert.equal(Object.prototype.propertyIsEnumerable.call(secondMove.finalState, 'pieces'), false);
});

test('완전 authoritative snapshot은 fallback 대신 자체 pieces를 사용한다', () => {
  const fallback = makeOnlineMoveState();
  const snapshot = {
    ...fallback,
    pieces: fallback.pieces.map((piece) => piece.id === 'piece-1'
      ? { ...piece, nodeId: 'n06', started: true }
      : piece),
    lastSequence: 11,
  };

  assert.equal(getAuthoritativeSnapshot(snapshot, fallback), snapshot);
});
""")
          PY
      - run: npm ci
      - run: npm run qa:validate-architecture
      - run: npm run test:unit
      - run: npm run build
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/controllers/useAuthoritativeGameSyncController.ts src/app/flows/authoritativeSnapshot.ts src/app/flows/localMoveOwnership.ts src/app/hooks/applySequenceEvent.ts tests/unit/localMoveHiddenPieces.test.ts
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: preserve fallback state for partial authoritative results'
          git push origin HEAD:agent/fix-local-move-snapshot-pieces
