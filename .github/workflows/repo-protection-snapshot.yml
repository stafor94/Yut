name: Repository protection snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  checks: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report branch protection and check context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const config = JSON.parse(fs.readFileSync('.github/qa-status-snapshot.json', 'utf8'));
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const apiBase = `https://api.github.com/repos/${owner}/${repo}`;
            const headers = {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'yut-repository-protection-snapshot',
            };
            async function raw(path, options = {}) {
              const response = await fetch(`${apiBase}${path}`, {
                ...options,
                headers: { ...headers, ...(options.headers ?? {}) },
              });
              const text = await response.text();
              let body = text;
              try {
                body = text ? JSON.parse(text) : null;
              } catch {}
              return { status: response.status, ok: response.ok, body };
            }
            const protection = await raw('/branches/main/protection');
            const rulesets = await raw('/rulesets?includes_parents=true&per_page=100');
            const checks = await raw(`/commits/${config.targetSha}/check-runs?per_page=100`);
            const matchingChecks = Array.isArray(checks.body?.check_runs)
              ? checks.body.check_runs
                  .filter((check) => check.name === 'Required PR gate')
                  .map((check) => ({
                    id: check.id,
                    name: check.name,
                    status: check.status,
                    conclusion: check.conclusion,
                    app: check.app ? { id: check.app.id, slug: check.app.slug, name: check.app.name } : null,
                    details_url: check.details_url,
                    head_sha: check.head_sha,
                  }))
              : [];
            const body = [
              '## Repository protection snapshot',
              '',
              '### Main branch protection',
              '```json',
              JSON.stringify(protection, null, 2),
              '```',
              '',
              '### Repository rulesets',
              '```json',
              JSON.stringify(rulesets, null, 2),
              '```',
              '',
              '### Required PR gate checks',
              '```json',
              JSON.stringify({ request: { status: checks.status, ok: checks.ok }, matchingChecks }, null, 2),
              '```',
            ].join('\n');
            const created = await raw('/issues', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title: '[Protection snapshot] main and PR1', body }),
            });
            if (!created.ok) throw new Error(`issue create failed: ${created.status} ${JSON.stringify(created.body)}`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
